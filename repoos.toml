# RepoOS configuration. All fields optional — these are the defaults.

defaultStatus = "inbox"
defaultAssignee = "unassigned"

# Optional features, off by default — uncomment to turn them on. Real
# secrets (API keys, client secrets) go in .env, never here (this file is
# git-tracked); see .env.example for the matching variables.

# [auth]                                # require login (email OTP / Google) — docs/native-auth.md
# enabled = true
# bootstrapAdmin = "you@example.com"    # only this email can claim the first admin account
#
# [auth.emailProvider]
# type = "resend"
# fromAddress = "noreply@yourdomain.com"
#
# [auth.google]                         # optional — adds a "Sign in with Google" button
# clientId = "..."                      # clientSecret goes in .env, not here

# [whisper]                             # voice-to-text in text areas
# provider = "groq"                     # or "openai"

# ntfyEnabled = true                    # push notifications on task lifecycle events
# ntfyTopic = "repoos_myproject"
# ntfyBaseUrl = "https://ntfy.sh"       # or your self-hosted ntfy server

# [board.columns]                       # rename display labels (display only)
# draft  = "Ideas"                      # status IDs are fixed; this only changes what you see
# inbox  = "Backlog"
# ready  = "Selected for development"
# active = "In progress"
# review = "Code review"
# done   = "Shipped"
[[areas]]
name = "macos"

[[areas]]
name = "web"

[[areas]]
name = "docs"


# Bootstrap validation: required tools fail rather than silently skip.
[[check.steps]]
name = "site"
command = "bun run check"
required = true

[[check.steps]]
name = "native-core"
command = "swift test --package-path macos"
required = true

[[check.steps]]
name = "native-app"
command = "swift build --package-path macos --product divot"
required = true

# Package and launch the local Divot.app preview: structure, ad-hoc signature,
# and a real run of the bundled executable. Never opens a window or claims a
# person looked at the bar.
[[check.steps]]
name = "native-app-bundle"
command = "scripts/smoke-app-bundle.sh"
required = true

[[preview.targets]]
name = "website"
areas = ["web", "docs"]
paths = ["site/**"]
command = "bun run dev --port {port}"
readyPath = "/"

[[check.steps]]
name = "justfile"
command = "just --fmt --check"
required = true
[[agents]]
name = "Ross"
cli = "opencode"
model = "big pickle"
enabled = false
instructions = "You are Ross, a repository-aware assistant inspired by Ross Geller from Friends — warm, enthusiastic, and genuinely curious about code and context. You answer questions about this repository, RepoOS, tasks, statuses, issues, and code with clear, helpful explanations and occasional dry wit. Never edit files, change task state, or modify the repository."
[[agents]]
name = "engineer"
cli = "pi"
model = "openrouter/deepseek/deepseek-v4.1-flash"
enabled = true
instructions = "Implements tasks: reads the task file, writes clean code, runs `repoos check`, updates the task status. Never invent evidence: do not fabricate device sessions, live API measurements, external account IDs, registration confirmations, or other proof you cannot observe in this run — leave those fields blank and say a human must supply them. Never kill processes by name or pattern (`pkill`, `killall`); RepoOS reaps your turn's process group when it ends. Stop only a helper's PID if you must stop it early."
[[agents]]
name = "reviewer"
cli = "cursor"
model = "composer-2.5"
enabled = true
instructions = "Reviews a task the moment it lands in `review`: reads the diff in the task's worktree and reports bugs, edge cases, and suggestions for the human signing off. Treat as blocking any invented or impossible evidence (physical-device sessions, measurements, external accounts or registrations marked confirmed, live API outcomes without a stated safe call) and any write the spec forbids — compare read-only specs to write calls in the diff and transcript. Never changes a task's status. Never use `pkill`, `killall`, or other pattern kills. For any user-visible change, ask 'were docs/ and site/ updated?' and treat a missing update (or a stated reason why no docs change applies) as blocking."
[[agents]]
name = "pm"
cli = "github copilot"
model = "default"
enabled = true
instructions = "Owns the roadmap: moves tasks between statuses, writes activity entries, keeps the work board tidy."
[[agents]]
name = "cto"
cli = "cursor"
model = "composer-2.5"
enabled = true
instructions = "You are the CTO: an always-on board monitor and un-sticker. Watch for stuck tasks, stale reviews, zombie processes, and broken builds. Report what you find, escalate when needed, and ask the human before taking action. Never move a task to done, merge branches, delete worktrees, change config, or spend money."

[[dev.targets]]
name = "site"
kind = "server"
command = "bun run dev -- --port 5180 --strictPort"
url = "http://127.0.0.1:5180"
label = "Website (HMR)"
healthCheck = { url = "http://127.0.0.1:5180/" }

# The native Divot bar: a foreground process with no URL, run from the Dev page.
[[dev.targets]]
name = "divot"
kind = "process"
command = "swift run --package-path macos divot"
label = "Divot bar"

# Product releases are opt-in (#0067). Pushing an annotated v<version> tag from
# clean main triggers .github/workflows/release.yml, which builds the DMG and
# creates the GitHub Release. RepoOS reads the committed semantic version from
# package.json; the root VERSION file is the separate local-preview version used
# by scripts/package-app.sh, and the two stay at the same number until the
# preview becomes a real release. See docs/infrastructure.md.
[release]
enabled = true
provider = "git-tag"
name = "Publish Divot"
branch = "main"
versionFile = "package.json"
tagPrefix = "v"
remote = "origin"
repository = "divotbar/divot"
workflow = ".github/workflows/release.yml"

# Where end users install a release from; rendered as the Releases page's
# "Published to" summary. Each channel's published version is checked against
# the release being viewed over a credential-free public endpoint, so an outage
# stays on its own row and never hides the others. These are install channels,
# not deploy environments: there are deliberately no [[deployments]] rows here
# until the maintainer supplies the Cloudflare values (a separate task).
[[distribution]]
name = "GitHub Releases"
kind = "github-release"
repository = "divotbar/divot"
url = "https://github.com/divotbar/divot/releases/tag/{tag}"
install = ["Download Divot.dmg from the GitHub release then drag Divot.app into Applications"]

[[distribution]]
name = "Homebrew"
kind = "homebrew"
package = "divotbar/tap/divot"
url = "https://github.com/divotbar/homebrew-tap/blob/main/Casks/divot.rb"
versionUrl = "https://raw.githubusercontent.com/divotbar/homebrew-tap/main/Casks/divot.rb"
# The cask declares its version on a `version "x.y.z"` line; this tells RepoOS's
# public, read-only status check how to read that same line.
versionRegex = 'version\s+"([^"]+)"'
install = ["brew install --cask divotbar/tap/divot"]
