name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      # Build the Release configuration of the Swift app and package it.
      # This produces Divot.app, a versioned zip archive, and checksums.
      # Strip leading 'v' from tag for CFBundleShortVersionString (dotted-numeric).
      - run: ./scripts/package-app.sh --configuration release --version "${TAG#v}"
        env:
          TAG: ${{ github.ref_name }}
      # Create the DMG from the packaged app. The DMG includes an Applications
      # symlink for drag-to-install.
      - run: ./scripts/make-dmg.sh
      # Generate the SHA-256 checksum for the DMG.
      - run: cd dist && shasum -a 256 Divot.dmg > Divot.dmg.sha256 && cat Divot.dmg.sha256
      # Build markdown release notes using printf to avoid leading spaces.
      - name: Prepare release notes
        run: |
          # GitHub Actions expands the workflow expressions before the shell sees them.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '# Divot ${{ github.ref_name }}' \
            '' \
            '**Note:** This is an unsigned build. To open Divot on your Mac:' \
            '1. Mount the DMG: double-click `Divot.dmg`' \
            '2. Right-click the Divot app and select "Open"' \
            '3. Click "Open" in the dialog (you only need to do this once)' \
            '4. Drag Divot to your Applications folder' \
            '' \
            '**Build info:**' \
            '- Configuration: Release' \
            '- Signing: Ad-hoc (unsigned; not Developer ID signed or notarized)' \
            '- Commit: ${{ github.sha }}' \
            '' \
            'Signed and notarized builds are planned for a future release.' \
            > /tmp/release_notes.md
      # Create the GitHub Release with the DMG and checksum files.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: |
            dist/Divot.dmg
            dist/Divot.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tap owns the cask and commits the update with its own
      # repository-scoped GITHUB_TOKEN. This secret only needs permission to
      # dispatch an event to the homebrew-tap repository. Skip cleanly (rather
      # than fail the release) when the tap has not been set up yet; see
      # docs/infrastructure.md for the one-time maintainer setup.
      - name: Request Homebrew tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/divotbar/homebrew-tap/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"divot-release\",\"client_payload\":{\"version\":\"${VERSION}\",\"source_repo\":\"${GITHUB_REPOSITORY}\"}}"
